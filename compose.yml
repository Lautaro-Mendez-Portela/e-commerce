services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ecommerce_net

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce_dev_password}@postgres:5432/${POSTGRES_DB:-ecommerce}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_me_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me_32_chars}
      ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      API_URL: ${API_URL:-http://localhost:3000}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-1mb}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_mock}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_mock}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: npm run docker:dev
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - ecommerce_net

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - ecommerce_net

  postgres-test:
    image: postgres:16-alpine
    profiles:
      - test
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-ecommerce_test}
      POSTGRES_USER: ${POSTGRES_TEST_USER:-ecommerce_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-ecommerce_test_password}
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ecommerce_net

  backend-test:
    build:
      context: ./backend
    profiles:
      - test
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_TEST_USER:-ecommerce_test}:${POSTGRES_TEST_PASSWORD:-ecommerce_test_password}@postgres-test:5432/${POSTGRES_TEST_DB:-ecommerce_test}
      DATABASE_URL_TEST: postgresql://${POSTGRES_TEST_USER:-ecommerce_test}:${POSTGRES_TEST_PASSWORD:-ecommerce_test_password}@postgres-test:5432/${POSTGRES_TEST_DB:-ecommerce_test}
      JWT_SECRET: ${JWT_SECRET_TEST:-test_jwt_secret_change_me_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET_TEST:-test_refresh_secret_change_me_32_chars}
      CLIENT_URL: http://localhost:5173
      STRIPE_SECRET_KEY: sk_test_mock
      STRIPE_WEBHOOK_SECRET: whsec_test_mock
      JSON_BODY_LIMIT: 1mb
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
    command: npm run docker:test:integration
    networks:
      - ecommerce_net

volumes:
  postgres_data:
  postgres_test_data:
  backend_node_modules:
  frontend_node_modules:

networks:
  ecommerce_net:
    driver: bridge
